services:
  - type: web
    name: psb-world-class-hrdm
    env: python
    plan: free
    buildCommand: pip install -r requirements-prod.txt
    startCommand: streamlit run app.py --server.port=$PORT --server.address=0.0.0.0 --server.headless=true
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: AUTH_MODE
        value: local
      - key: APP_ENV
        value: production
      - key: ENABLE_DEMO_SEED
        value: "false"
      - key: INITIAL_ADMIN_NAME
        value: PSB Administrator
      - key: INITIAL_ADMIN_EMAIL
        sync: false
      - key: INITIAL_ADMIN_LOGIN
        sync: false
      - key: INITIAL_ADMIN_PASSWORD
        sync: false
      - key: SESSION_IDLE_MINUTES
        value: "30"
      - key: SESSION_MAX_HOURS
        value: "12"
      - key: SUPABASE_BUCKET
        value: psb-hrdm-files
      - key: PUBLIC_URL
        value: https://training.psbureau.org
      - key: VERIFY_PUBLIC_URL
        value: https://training.psbureau.org
      - key: MIN_PASSWORD_LENGTH
        value: "12"
