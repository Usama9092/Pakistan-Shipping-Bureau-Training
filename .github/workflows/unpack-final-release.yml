name: Install final PSB release

on:
  push:
    branches: [main]
    paths: [release_payload.zip]

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace repository application
        shell: bash
        run: |
          find . -mindepth 1 -maxdepth 1 ! -name .git ! -name .github ! -name release_payload.zip -exec rm -rf {} +
          unzip -oq release_payload.zip
          rm -f release_payload.zip
          rm -f .github/workflows/unpack-final-release.yml
      - name: Commit session-guard hotfix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix first-login password session guard"
          git push
